name: Scheduled News Crawl


on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {} 
concurrency:
  group: news-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache model Hugging Face (sentiment)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-${{ runner.os }}-indobert-sentiment-news

      - name: Install dependencies
        run: pip install feedparser APScheduler python-dotenv supabase Sastrawi transformers torch

      - name: Jalankan crawl sekali
        env:
          DB_BACKEND: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python crawl_once.py

      - name: Jalankan text preprocessing
        env:
          DB_BACKEND: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python preprocess_all.py

      - name: Jalankan sentiment analysis
        env:
          DB_BACKEND: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sentiment_analysis.py